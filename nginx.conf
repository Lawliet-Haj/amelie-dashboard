server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/x-font-ttf font/opentype image/svg+xml;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ⚠️ index.html ne doit JAMAIS être mis en cache.
    # Les bundles sont hachés (index-<hash>.js) et servis en `immutable` : à chaque
    # déploiement leur nom change et l'ancien disparaît. Si le navigateur réutilise un
    # index.html en cache, il réclame un bundle qui renvoie 404 → application morte,
    # jusqu'à un Ctrl+Shift+R manuel. Sans en-tête explicite, nginx n'en envoie aucun
    # et le navigateur applique sa propre heuristique (basée sur Last-Modified) : il
    # garde donc l'ancienne page. Constaté en production le 2026-08-25.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Aggressive caching for hashed assets (JS/CSS bundles)
    location ~* \.(js|css|woff2?|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Short cache for images/icons
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
